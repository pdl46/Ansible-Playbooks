- name: Deploy and configure MariaDB
  hosts: WebServer
  tasks:
    - name: Install MariaDB Server
      ansible.builtin.yum:
        name: mariadb-server
        state: latest

    - name: Start MariaDB service
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes

    - name: Enable MariaDB service
      ansible.builtin.copy:
        src: ../../my.cnf
        dest: /etc/my.cnf
      notify:
        - restart_mariadb

  handlers:
    - name: restart_mariadb
      ansible.builtin.service:
        name: mariadb
        state: restarted     
